<style>
:root {
  --paper: #F2F4F8; --surface: #FFFFFF; --surface-2: #F7F8FB; --ink: #16213A; --ink-2: #4A5571; --ink-3: #6B7590;
  --rule: #DCE1EA; --rule-2: #C5CCDA; --pencil: #2550C8; --pencil-ink: #FFFFFF; --pencil-soft: #E7EDFC; --margin: #A9BDF3;
  --mark: #FFE36E; --cut: #B42318; --cut-soft: #FCEBE9; --warn: #8A5A00; --warn-soft: #FFF3CC; --keep: #1C7A4C;
  --shadow: 0 10px 32px rgba(16, 26, 51, .12);
  --sans: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gut: 5.5rem;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0D131F; --surface: #141C2B; --surface-2: #192233; --ink: #E6EBF4; --ink-2: #AAB4C9; --ink-3: #8691A9;
    --rule: #263049; --rule-2: #36425E; --pencil: #86A3FF; --pencil-ink: #0D131F; --pencil-soft: #1D2948; --margin: #3D5397;
    --mark: #5C4C10; --cut: #FF8F86; --cut-soft: #3A1F23; --warn: #F2C35B; --warn-soft: #362D13; --keep: #66D19A; --shadow: 0 10px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0D131F; --surface: #141C2B; --surface-2: #192233; --ink: #E6EBF4; --ink-2: #AAB4C9; --ink-3: #8691A9;
  --rule: #263049; --rule-2: #36425E; --pencil: #86A3FF; --pencil-ink: #0D131F; --pencil-soft: #1D2948; --margin: #3D5397;
  --mark: #5C4C10; --cut: #FF8F86; --cut-soft: #3A1F23; --warn: #F2C35B; --warn-soft: #362D13; --keep: #66D19A; --shadow: 0 10px 32px rgba(0, 0, 0, .5);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
button, input { font: inherit; color: inherit; }
a { color: var(--pencil); text-underline-offset: 2px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
p { margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: .6rem 1.05rem; border-radius: 9px; border: 1px solid var(--rule-2);
  background: var(--surface); color: var(--ink); font: 600 .9rem/1.1 var(--sans); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: progress; }

/* one window: header on top, the backup fills the rest */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 1rem; padding: .7rem clamp(.75rem, 3vw, 1.5rem); background: var(--surface); border-bottom: 1px solid var(--rule); min-width: 0; }
.brand { display: flex; align-items: center; gap: .5rem; background: none; border: 0; padding: .2rem; cursor: pointer; font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; flex: none; border-radius: 8px; }
.logo { width: 1.7rem; height: 1.7rem; border-radius: 6px; background: var(--pencil); position: relative; flex: none; }
.logo::before { content: ""; position: absolute; left: 24%; top: 18%; width: 46%; height: 60%; background: #fff; border-radius: 2px; }
.logo::after { content: ""; position: absolute; right: 13%; bottom: 13%; width: 36%; height: 36%; background: #FFE36E; border-radius: 3px; box-shadow: 0 0 0 1.5px var(--pencil); }
.bar { flex: 1; min-width: 0; max-width: 46rem; display: flex; gap: .4rem; padding: .3rem; border: 1.5px solid var(--rule-2); border-radius: 12px; background: var(--surface-2); }
.bar:focus-within { border-color: var(--pencil); box-shadow: 0 0 0 3px var(--pencil-soft); background: var(--surface); }
.url { flex: 1; min-width: 0; border: 0; background: transparent; padding: .5rem .6rem; font-size: 1rem; outline: none; }
.go { flex: none; padding-inline: 1.3rem; }

/* start screen: just the box, centred */
.app.idle { grid-template-rows: minmax(0, 1fr); }
.app.idle .top { flex-direction: column; justify-content: center; gap: 1rem; border: 0; background: var(--paper); padding-bottom: 12vh; }
.app.idle .brand { font-size: clamp(1.7rem, 4vw, 2.3rem); gap: .7rem; }
.app.idle .logo { width: 2.6rem; height: 2.6rem; border-radius: 9px; }
.tagline { color: var(--ink-2); font-size: 1.02rem; text-align: center; max-width: 34rem; }
.app.idle .bar { width: 100%; flex: none; max-width: 40rem; padding: .4rem; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.app.idle .url { font-size: 1.12rem; padding: .7rem .8rem; }

    }
    useEffect(function () {
      function onPaste(e) { if (inField(e.target)) return; var t = e.clipboardData && e.clipboardData.getData('text/plain'); if (!t) return; e.preventDefault(); load(t); }
      function over(e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); }
      function drop(e) {
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return; e.preventDefault();
        f.arrayBuffer().then(function (buf) { load(CB.decodeFile(buf, f.name).html, f.name); }).catch(function (er) { setToast({ text: er.message }); });
      }
      window.addEventListener('paste', onPaste); window.addEventListener('dragover', over); window.addEventListener('drop', drop);
      return function () { window.removeEventListener('paste', onPaste); window.removeEventListener('dragover', over); window.removeEventListener('drop', drop); };
    }, []);

    var exp = useMemo(function () { return entry ? CB.exportBackup(entry.r, excluded, OPTS) : null; }, [entry, excluded]);
    function copyCode() { copyText(BOOKMARK_HREF).then(function (ok) { setToast({ text: ok ? 'Button copied. Add a new bookmark and paste it as the address (URL).' : 'Copying was blocked. Drag the button instead.' }); }); }

    return html`<div className="app">
      ${entry ? html`<header className="top"><button className="brand" onClick=${function () { setEntry(null); }} aria-label="Back to Copy Backup home"><span className="logo" aria-hidden="true"></span><span>Copy Backup</span></button></header>
        <div className="stage"><${Result} r=${entry.r} excluded=${excluded} snippet=${exp ? snippetOf(entry.r, exp) : ''}
          onRemove=${function (idx) { setExcluded(function (s) { var n = new Set(s); n.add(idx); return n; }); setToast({ text: 'Left out of the backup.', undo: idx }); }}
          onDownload=${function () { saveFile(CB.buildFilename(entry.r, 'html'), exp.fullHtml).then(function (ok) { setToast({ text: ok ? 'Backup downloaded.' : 'Download isn’t available here. Use Copy instead.' }); }); }}
          onCopy=${function () { copyText(snippetOf(entry.r, exp)).then(function (ok) { setToast({ text: ok ? 'HTML copied.' : 'Copying was blocked. Use Download instead.' }); }); }} /></div>`
      : html`<${Home} onCopyCode=${copyCode} onClickInstead=${function () { setToast({ text: 'Drag this button to your bookmarks bar, then click it on the page you want to back up.' }); }} />`}
      <div className="toast-wrap" aria-live="polite">${toast ? html`<div className="toast">${toast.text}${toast.undo !== undefined ? html` <button onClick=${function () { setExcluded(function (s) { var n = new Set(s); n.delete(toast.undo); return n; }); setToast(null); }}>Undo</button>` : null}</div>` : null}</div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();

</script>
</body>
</html>
