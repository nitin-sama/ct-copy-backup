<style>
:root {
  --paper: #F2F4F8; --surface: #FFFFFF; --surface-2: #F7F8FB; --ink: #16213A; --ink-2: #4A5571; --ink-3: #6B7590;
  --rule: #DCE1EA; --rule-2: #C5CCDA;
  --pencil: #2550C8; --pencil-ink: #FFFFFF; --pencil-soft: #E7EDFC; --margin: #A9BDF3;
  --mark: #FFE36E; --mark-ink: #463800; --keep: #1C7A4C; --cut: #B42318; --cut-soft: #FCEBE9; --warn: #8A5A00; --warn-soft: #FFF3CC;
  --code-bg: #101A33; --code-ink: #DCE4F5; --hl-t: #93B3FF; --hl-a: #F3C56E; --hl-v: #9EE2B6; --hl-c: #7F8BA8;
  --scrim: rgba(12, 18, 32, .45);
  --sans: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gut: 5.5rem;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0D131F; --surface: #141C2B; --ink: #E6EBF4; --ink-2: #AAB4C9; --ink-3: #8691A9;
    --surface-2: #192233; --rule: #263049; --rule-2: #36425E;
    --pencil: #86A3FF; --pencil-ink: #0D131F; --pencil-soft: #1D2948; --margin: #3D5397;
    --mark: #5C4C10; --mark-ink: #FFE9A6; --keep: #66D19A; --cut: #FF8F86; --cut-soft: #3A1F23; --warn: #F2C35B; --warn-soft: #362D13;
    --code-bg: #090E19; --scrim: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0D131F; --surface: #141C2B; --ink: #E6EBF4; --ink-2: #AAB4C9; --ink-3: #8691A9;
  --surface-2: #192233; --rule: #263049; --rule-2: #36425E;
  --pencil: #86A3FF; --pencil-ink: #0D131F; --pencil-soft: #1D2948; --margin: #3D5397;
  --mark: #5C4C10; --mark-ink: #FFE9A6; --keep: #66D19A; --cut: #FF8F86; --cut-soft: #3A1F23; --warn: #F2C35B; --warn-soft: #362D13;
  --code-bg: #090E19; --scrim: rgba(0, 0, 0, .6);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pencil); text-underline-offset: 2px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
kbd { font: 500 .8125rem/1 var(--mono); padding: .15rem .4rem; border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); }
code { font-family: var(--mono); font-size: .875em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.quiet { color: var(--ink-2); }
.small { font-size: .8125rem; }
.bad { color: var(--cut); font-weight: 600; }
.hint { color: var(--ink-3); font-size: .8125rem; line-height: 1.45; }
.row { display: flex; align-items: center; gap: .5rem; }
.row.wrap { flex-wrap: wrap; }

.app { max-width: 1280px; margin: 0 auto; padding: 1.5rem clamp(.85rem, 3vw, 2rem) 5rem; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem 2rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.brand h1 { font-size: clamp(1.6rem, 2.6vw, 2.1rem); font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.brand h1::after { content: ""; display: inline-block; width: .5em; height: .5em; margin-left: .2em; background: var(--mark); border-radius: 2px; vertical-align: .05em; }
.brand p { color: var(--ink-2); margin-top: .35rem; max-width: 46ch; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .66rem 1rem; border-radius: 8px; border: 1px solid var(--rule-2);
  background: var(--surface); color: var(--ink); font: 600 .9375rem/1.1 var(--sans); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: .42rem .7rem; font-size: .8125rem; border-radius: 7px; }
.btn:disabled, .btn.is-disabled { opacity: .45; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: .2rem 0; color: var(--pencil); font: 500 .8125rem/1.3 var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.link-btn:disabled { color: var(--ink-3); text-decoration: none; cursor: default; }

/* intake */
.intake { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(1rem, 2.4vw, 1.5rem); }

.mode-fetch, .mode-paste, .mode-upload { display: flex; flex-direction: column; gap: .75rem; }
.code-input, .text-input { width: 100%; padding: .7rem .8rem; border: 1px solid var(--rule-2); border-radius: 9px; background: var(--surface-2); font: .8125rem/1.5 var(--mono); resize: vertical; }

  display: grid; place-items: center; font: 600 .8125rem/1 var(--mono); margin-top: .05rem; }

  font-weight: 700; font-size: .9375rem; text-decoration: none; border: 1.5px dashed color-mix(in srgb, var(--mark-ink) 55%, transparent); cursor: grab; }

.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; padding: 2rem 1rem; border: 2px dashed var(--rule-2);
  border-radius: 12px; background: var(--surface-2); text-align: center; cursor: pointer; }

.url-line { margin: .25rem 0 .2rem; overflow-wrap: anywhere; font-size: .9375rem; }

.main-col { min-width: 0; }

.tab-bar { display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; margin-bottom: .75rem; }

/* the proof: tag annotations in a margin, copy on the page */
.proof { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  background: linear-gradient(to right, var(--surface-2) 0, var(--surface-2) var(--gut), var(--margin) var(--gut), var(--margin) calc(var(--gut) + 2px), var(--surface) calc(var(--gut) + 2px)); }

.rich dt { font-weight: 600; } .rich dd { margin: 0 0 .3rem 1rem; }

.rich a { color: var(--pencil); }
.chip { font: 500 .7rem/1 var(--mono); background: var(--pencil-soft); color: var(--pencil); padding: .15rem .35rem; border-radius: 4px; font-style: normal; vertical-align: .1em; }
.media-list { display: flex; flex-wrap: wrap; gap: .9rem 1.5rem; }
.imgcard { display: flex; gap: .85rem; align-items: flex-start; margin: 0; min-width: 0; max-width: 100%; }
.thumb { flex: none; width: 4.5rem; height: 4.5rem; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface-2); }
.thumb.ph { display: grid; place-items: center; font: 500 .7rem var(--mono); color: var(--ink-3); text-transform: lowercase;
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--paper) 6px 12px); }
.imgcard figcaption { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.file { font: 500 .78rem/1.35 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }

.alt.warn { font: 600 .8125rem/1.4 var(--sans); color: var(--warn); }
.empty-tab { padding: 2rem 1.25rem; border: 1px dashed var(--rule-2); border-radius: 12px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: .25rem; padding: .2rem; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--rule); }
.seg-btn { border: 0; background: transparent; padding: .38rem .7rem; border-radius: 7px; font-size: .8125rem; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg-btn[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 0 0 1px var(--rule-2); }
.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 12px; padding: 1rem 1.1rem; overflow: auto; max-height: 72vh; font: .8rem/1.6 var(--mono); white-space: pre; tab-size: 2; }
.hl-t { color: var(--hl-t); } .hl-a { color: var(--hl-a); } .hl-v { color: var(--hl-v); } .hl-c { color: var(--hl-c); }

.img-table td { padding: .6rem .8rem; border-bottom: 1px solid var(--rule); vertical-align: top; }

.img-table tr.off td { opacity: .45; }

.img-cell > div { display: flex; flex-direction: column; gap: .2rem; min-width: 0; align-items: flex-start; }
.alt-cell { font: 400 .9375rem/1.4 var(--serif); min-width: 12rem; }
.status { font-size: .78rem; font-weight: 600; white-space: nowrap; }
.s-ok { color: var(--keep); } .s-missing { color: var(--cut); } .s-filename, .s-long { color: var(--warn); } .s-empty, .s-bg { color: var(--ink-2); }

.scope-note { padding: .85rem 1rem; border-left: 3px solid var(--pencil); background: var(--surface); border-radius: 0 10px 10px 0; margin-bottom: 1.25rem; display: grid; gap: .25rem; }
.scope-note code { overflow-wrap: anywhere; }
.rm-group { margin-bottom: 1.25rem; }
.rm-group h3 { font-size: .9375rem; font-weight: 700; margin-bottom: .45rem; }
.rm-group h3 .count { font: 500 .75rem var(--mono); color: var(--ink-3); }
.rm-group ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
.rm { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; padding: .7rem .9rem; border-top: 1px solid var(--rule); }
.rm:first-child { border-top: 0; }
.rm-body { min-width: 0; display: grid; gap: .15rem; }
.rm-desc { font-size: .75rem; color: var(--cut); overflow-wrap: anywhere; }

/* side panel */
.side { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 0 1.1rem; position: sticky; top: calc(1rem + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 2rem - env(safe-area-inset-top, 0px)); overflow: auto; }
.side section { padding: 1rem 0; border-top: 1px solid var(--rule); }
.side section:first-child { border-top: 0; }
.side h3 { font-size: .8125rem; font-weight: 650; color: var(--ink-2); margin-bottom: .4rem; letter-spacing: .01em; }
.meta-val { font: 500 1rem/1.45 var(--serif); overflow-wrap: anywhere; }
.meter { margin-top: .55rem; display: grid; gap: .3rem; }
.meter .bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.meter .bar span { display: block; height: 100%; background: var(--keep); border-radius: 2px; }
.meter.warn .bar span { background: var(--warn); }
.meter p { font-size: .78rem; color: var(--ink-2); }
.meter.warn p { color: var(--warn); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; font-size: .8125rem; line-height: 1.45; }
.chk { position: relative; padding-left: .95rem; overflow-wrap: anywhere; }
.chk::before { content: ""; position: absolute; left: 0; top: .42em; width: .45rem; height: .45rem; border-radius: 2px; background: var(--ink-3); }
.chk.error::before { background: var(--cut); } .chk.warn::before { background: #D59A12; } .chk.info::before { background: var(--margin); }
.dl { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: .35rem .75rem; margin: 0; font-size: .8125rem; }
.dl dt { color: var(--ink-3); }
.dl dd { margin: 0; overflow-wrap: anywhere; }

.error-card { padding: 1.25rem; border: 1px solid var(--cut); background: var(--cut-soft); border-radius: 12px; display: grid; gap: .5rem; justify-items: start; }

/* empty state */
.empty { display: grid; grid-template-columns: minmax(0, 22rem) minmax(0, 1fr); gap: 1.5rem 2.5rem; align-items: start; padding-top: .5rem; }

.empty p { color: var(--ink-2); }
.proof.sample { pointer-events: none; }
.proof.sample .prow:nth-child(n+4) { opacity: .75; } .proof.sample .prow:nth-child(n+5) { opacity: .45; }

/* drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; justify-content: flex-end; }
.drawer { width: min(31rem, 100%); height: 100%; background: var(--surface); overflow: auto; outline: none;
  padding: calc(1.1rem + env(safe-area-inset-top, 0px)) 1.35rem calc(2rem + env(safe-area-inset-bottom, 0px)); box-shadow: -16px 0 40px rgba(0, 0, 0, .18); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.drawer-head h2 { font-size: 1.2rem; font-weight: 750; }
.drawer-body { display: grid; gap: .9rem; }
.drawer-body h3 { font-size: 1rem; font-weight: 700; margin-top: .6rem; }
.drawer-body ul, .drawer-body ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .4rem; }
.help-steps li::marker { font-family: var(--mono); color: var(--pencil); }
.help-dl { margin: 0; display: grid; gap: .25rem; }
.help-dl dt { font-weight: 650; margin-top: .4rem; }
.help-dl dd { margin: 0; color: var(--ink-2); }
fieldset { border: 0; margin: 0 0 .5rem; padding: 0; display: grid; gap: .55rem; }
legend { font-weight: 700; font-size: 1rem; margin-bottom: .5rem; padding: 0; }
.opt { display: grid; grid-template-columns: 1.25rem 1fr; gap: .55rem; align-items: start; cursor: pointer; }
.opt input { margin: .2rem 0 0; width: 1rem; height: 1rem; accent-color: var(--pencil); }
.opt > span { display: grid; gap: .1rem; }
.opt-label { font-weight: 500; }

/* toast */
.toast-wrap { position: fixed; left: 50%; bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; width: max-content; max-width: min(36rem, calc(100vw - 1.5rem)); }
.toast { background: var(--ink); color: var(--paper); padding: .75rem 1.05rem; border-radius: 10px; font-weight: 600; font-size: .9rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); animation: rise .18s ease-out; }
.toast.warn { background: var(--warn); color: #fff; }
.toast.error { background: var(--cut); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast.warn, :root:not([data-theme="light"]) .toast.error { color: #10141d; } }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } }

@media (max-width: 1020px) {
  .result-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .result-actions { align-items: flex-start; }
  .result-actions .minor { justify-content: flex-start; }
  .empty { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  :root { --gut: 4.1rem; }
  .gutter { padding: .9rem .45rem .7rem .2rem; }
  .tag { font-size: .6875rem; }
  .url-row { flex-direction: column; }
  .url-row .btn { width: 100%; padding-block: .8rem; }
  .copy { padding-left: .85rem; padding-right: .5rem; }
  .prow { grid-template-columns: var(--gut) minmax(0, 1fr) 2.3rem; }
  .rich { font-size: 1rem; }
  .rich h1 { font-size: 1.5rem; } .rich h2 { font-size: 1.25rem; }
  .thumb { width: 3.5rem; height: 3.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  .toast { animation: none; }
}
</style>

<script>
/* ===== Copy Backup engine ===== */

        </div>
      </header>
      <${Intake} mode=${mode} setMode=${function (m) { modeTouched.current = true; setMode(m); }} fetchReady=${fetchReady} url=${url} setUrl=${setUrl} busy=${busy} notify=${notify} doCopy=${doCopy}
        onFetch=${doFetch} onFiles=${doFiles} onPasteText=${doPasteText} />
      ${busy && html`<div className="busy" role="status"><span className="spinner" aria-hidden="true"></span>${busy}</div>`}
      ${entries.length > 1 && html`<${Session} entries=${entries} activeId=${activeId} setActiveId=${setActiveId} onRemove=${removeEntry}
        onDownloadAll=${downloadAll} onClear=${function () { setEntries([]); }} />`}
      <div id="result">
        ${active ? (active.result
          ? html`<${Result} key=${active.id} entry=${active} opts=${opts} onToggle=${onToggle} onSetExcluded=${onSetExcluded} onRestore=${onRestore}
              onRemove=${function () { removeEntry(active.id); }} doCopy=${doCopy} doSave=${doSave} />`
          : html`<${ErrorCard} entry=${active} onRemove=${function () { removeEntry(active.id); }} />`)
          : html`<${Empty} />`}
      </div>
      ${panel === 'help' && html`<${Help} fetchReady=${fetchReady} onClose=${function () { setPanel(null); }} />`}
      ${panel === 'settings' && html`<${Settings} opts=${opts} setOpts=${setOpts} onClose=${function () { setPanel(null); }} />`}
      ${manual !== null && html`<${ManualCopy} text=${manual} onClose=${function () { setManual(null); }} />`}
      <div className="toast-wrap" aria-live="polite">${toast && html`<div key=${toast.key} className=${'toast ' + toast.kind}>${toast.text}</div>`}</div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();

</script>
</body>
</html>
