<style>
:root {
  --paper: #F2F4F8; --surface: #FFFFFF; --surface-2: #F7F8FB; --ink: #16213A; --ink-2: #4A5571; --ink-3: #6B7590;
  --rule: #DCE1EA; --rule-2: #C5CCDA;
  --pencil: #2550C8; --pencil-ink: #FFFFFF; --pencil-soft: #E7EDFC; --margin: #A9BDF3;
  --mark: #FFE36E; --mark-ink: #463800; --keep: #1C7A4C; --keep-soft: #E3F4EA; --cut: #B42318; --cut-soft: #FCEBE9; --warn: #8A5A00; --warn-soft: #FFF3CC;
  --code-bg: #101A33; --code-ink: #DCE4F5; --hl-t: #93B3FF; --hl-a: #F3C56E; --hl-v: #9EE2B6; --hl-c: #7F8BA8;
  --serp-title: #1a0dab; --serp-text: #4d5156; --serp-meta: #202124;
  --scrim: rgba(12, 18, 32, .45); --shadow: 0 12px 40px rgba(16, 26, 51, .16);
  --sans: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gut: 5.25rem; --rail: 17rem;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0D131F; --surface: #141C2B; --surface-2: #192233; --ink: #E6EBF4; --ink-2: #AAB4C9; --ink-3: #8691A9;
    --rule: #263049; --rule-2: #36425E; --pencil: #86A3FF; --pencil-ink: #0D131F; --pencil-soft: #1D2948; --margin: #3D5397;
    --mark: #5C4C10; --mark-ink: #FFE9A6; --keep: #66D19A; --keep-soft: #14302A; --cut: #FF8F86; --cut-soft: #3A1F23; --warn: #F2C35B; --warn-soft: #362D13;
    --code-bg: #090E19; --serp-title: #8ab4f8; --serp-text: #bdc1c6; --serp-meta: #dadce0; --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0D131F; --surface: #141C2B; --surface-2: #192233; --ink: #E6EBF4; --ink-2: #AAB4C9; --ink-3: #8691A9;
  --rule: #263049; --rule-2: #36425E; --pencil: #86A3FF; --pencil-ink: #0D131F; --pencil-soft: #1D2948; --margin: #3D5397;
  --mark: #5C4C10; --mark-ink: #FFE9A6; --keep: #66D19A; --keep-soft: #14302A; --cut: #FF8F86; --cut-soft: #3A1F23; --warn: #F2C35B; --warn-soft: #362D13;
  --code-bg: #090E19; --serp-title: #8ab4f8; --serp-text: #bdc1c6; --serp-meta: #dadce0; --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 40px rgba(0, 0, 0, .5);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pencil); text-underline-offset: 2px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
kbd { font: 500 .75rem/1 var(--mono); padding: .14rem .38rem; border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); }
code { font-family: var(--mono); font-size: .875em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.quiet { color: var(--ink-2); } .small { font-size: .8125rem; } .bad { color: var(--cut); font-weight: 600; } .warn-text { color: var(--warn); font-weight: 600; font-size: .8125rem; }
.hint { color: var(--ink-3); font-size: .8rem; line-height: 1.45; }
.row { display: flex; align-items: center; gap: .5rem; } .row.wrap { flex-wrap: wrap; }
.spinner { display: inline-block; width: .9rem; height: .9rem; border: 2px solid var(--rule-2); border-top-color: var(--pencil); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -.1em; }
@keyframes spin { to { transform: rotate(360deg); } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; padding: .55rem .9rem; border-radius: 8px; border: 1px solid var(--rule-2);
  background: var(--surface); color: var(--ink); font: 600 .875rem/1.1 var(--sans); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--rule); }
.btn.small { padding: .36rem .62rem; font-size: .78rem; border-radius: 7px; }
.btn.icon-btn { width: 2.2rem; height: 2.2rem; padding: 0; font-size: 1rem; }

.btn:disabled { opacity: .45; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--pencil); font: 500 .78rem/1.3 var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* app shell: exactly one window, nothing outside the panes scrolls */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.body { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 0; position: relative; }
.main { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); }

/* top bar */
.topbar { display: flex; align-items: center; gap: .75rem; padding: .55rem 1rem; background: var(--surface); border-bottom: 1px solid var(--rule); min-width: 0; }
.brand { display: flex; align-items: center; gap: .5rem; background: none; border: 0; padding: .2rem .3rem; cursor: pointer; color: var(--ink); flex: none; border-radius: 8px; }
.logo { width: 1.65rem; height: 1.65rem; border-radius: 6px; background: var(--pencil); position: relative; flex: none; }
.logo::before { content: ""; position: absolute; left: 26%; top: 18%; width: 46%; height: 60%; background: #fff; border-radius: 2px; box-shadow: inset 0 .28rem 0 -.18rem var(--pencil), inset 0 .52rem 0 -.42rem #fff; }
.logo::after { content: ""; position: absolute; right: 14%; bottom: 14%; width: 34%; height: 34%; background: #FFE36E; border-radius: 3px; box-shadow: 0 0 0 1.5px var(--pencil); }

.rail-toggle { display: none; }
.command { flex: 1; min-width: 0; display: flex; align-items: center; gap: .3rem; padding: .25rem .25rem .25rem .3rem; border: 1.5px solid var(--rule-2); border-radius: 11px; background: var(--surface-2); max-width: 56rem; }

.command.busy { background-image: linear-gradient(90deg, transparent, var(--pencil-soft), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sweep 1.4s linear infinite; }
@keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.command-input { flex: 1; min-width: 0; border: 0; background: transparent; padding: .45rem .5rem; font-size: 1rem; outline: none; }
.url-count { flex: none; font: 600 .72rem/1 var(--mono); color: var(--pencil); background: var(--pencil-soft); padding: .3rem .45rem; border-radius: 999px; }
.opt-btn { color: var(--ink-2); font-weight: 600; }
.go { flex: none; padding: .55rem 1.05rem; }
.top-actions { display: flex; gap: .15rem; flex: none; margin-left: auto; }
.menu-wrap { position: relative; flex: none; }
.menu { position: absolute; top: calc(100% + .4rem); z-index: 30; min-width: 16rem; max-width: min(22rem, 90vw); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: .3rem; }
.menu.right { right: 0; } .menu.left { left: 0; }
.menu-section + .menu-section { border-top: 1px solid var(--rule); margin-top: .25rem; padding-top: .25rem; }
.menu-label { font-size: .72rem; font-weight: 650; color: var(--ink-3); padding: .35rem .6rem .15rem; }
.menu-item { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .45rem .6rem; border-radius: 7px; cursor: pointer; font-size: .85rem; font-weight: 500; }
.menu-item:hover:not(:disabled) { background: var(--surface-2); }
.menu-item:disabled { opacity: .45; cursor: not-allowed; }
.menu-item[aria-checked="true"] { color: var(--pencil); font-weight: 650; }
.menu-item[aria-checked="true"]::before { content: "✓ "; }
.menu-hint { display: block; font-size: .72rem; font-weight: 400; color: var(--ink-3); margin-top: .1rem; }
.menu-note { font-size: .74rem; color: var(--warn); padding: .2rem .6rem .4rem; }

/* history rail */
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--rule); }
.rail-head { padding: .75rem .8rem .5rem; display: grid; gap: .45rem; }
.rail-title { font-weight: 700; font-size: .85rem; }
.count { font: 500 .72rem/1 var(--mono); color: var(--ink-3); }

.rail-main { display: grid; gap: .08rem; width: 100%; text-align: left; background: none; border: 0; padding: .5rem 1.7rem .5rem .55rem; cursor: pointer; border-radius: 9px; }
.rail-line1 { display: flex; align-items: center; gap: .4rem; min-width: 0; }

.rail-line3 { font-size: .7rem; color: var(--ink-3); padding-left: .95rem; }
.rail-x { position: absolute; right: .25rem; top: .4rem; width: 1.5rem; height: 1.5rem; border: 0; border-radius: 6px; background: none; color: var(--ink-3); cursor: pointer; opacity: 0; font-size: 1rem; }

.rail-x:hover { color: var(--cut); background: var(--cut-soft); }
.dot { flex: none; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--keep); }

.rail-note { font-size: .72rem; color: var(--warn); padding: 0 .8rem .6rem; }

/* home, no-service, jobs */
.home { height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 28rem) minmax(0, 30rem); gap: 2rem 3rem; align-content: center; align-items: center; justify-content: center; padding: 2rem clamp(1rem, 4vw, 3rem); }
.home h1 { font-size: clamp(1.5rem, 2.4vw, 2.05rem); font-weight: 800; letter-spacing: -.025em; line-height: 1.12; }
.home-copy h1::after { content: ""; display: inline-block; width: .42em; height: .42em; margin-left: .18em; background: var(--mark); border-radius: 2px; }
.lead { color: var(--ink-2); margin-top: .7rem; font-size: .98rem; }
.ways { list-style: none; padding: 0; margin: 1.1rem 0 0; display: grid; gap: .5rem; font-size: .88rem; color: var(--ink-2); }
.ways li { padding-left: 1rem; position: relative; }

.ways b { color: var(--ink); }
.noservice { grid-template-columns: minmax(0, 36rem); }
.help-steps { margin: .4rem 0 0; padding-left: 1.3rem; display: grid; gap: .45rem; }
.help-steps.big { font-size: 1rem; margin-top: 1rem; }
.help-steps li::marker { font-family: var(--mono); color: var(--pencil); }
.jobs { height: 100%; overflow: auto; padding: clamp(1rem, 3vw, 2.25rem); max-width: 52rem; width: 100%; margin: 0 auto; }
.jobs-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .9rem; }
.jobs-head h2 { font-size: 1.2rem; font-weight: 750; }
.job-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.job { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding: .8rem 1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 11px; }
.job.s-error { border-color: color-mix(in srgb, var(--cut) 45%, var(--rule)); }
.job-icon { display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--surface-2); color: var(--ink-3); font-weight: 700; }
.job.s-done .job-icon { background: var(--keep-soft); color: var(--keep); }
.job.s-error .job-icon { background: var(--cut-soft); color: var(--cut); }
.job-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-msg { font-size: .82rem; color: var(--ink-2); }
.job.s-error .job-msg { color: var(--cut); }
.job-steps { display: flex; gap: .3rem; margin-top: .45rem; }
.step { height: 3px; flex: 1; max-width: 5rem; border-radius: 2px; background: var(--rule); }
.step.past { background: var(--keep); } .step.past.skipped { background: var(--rule-2); }
.step.now { background: linear-gradient(90deg, var(--pencil) 40%, var(--pencil-soft) 40%); background-size: 250% 100%; animation: pulse 1.1s linear infinite; }
@keyframes pulse { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.jobs-tip { margin-top: 1rem; font-size: .82rem; color: var(--ink-2); }

/* result */
.result { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; min-height: 0; }
.result-head { display: flex; align-items: center; gap: .75rem 1.5rem; padding: .7rem 1.1rem .35rem; min-width: 0; }
.result-id { min-width: 0; flex: 1; }
.result-id h2 { font-size: 1.12rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-sub { font-size: .78rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sep { margin: 0 .38rem; color: var(--ink-3); }
.result-actions { display: flex; gap: .35rem; align-items: center; flex: none; }
.tabs { display: flex; gap: 1.1rem; padding: 0 1.1rem; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: .5rem 0 .55rem; color: var(--ink-2); font-weight: 500; font-size: .88rem; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--pencil); }
.tab .warnc { color: var(--warn); }
.panel { min-height: 0; overflow: hidden; }
.tab-grid { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; min-height: 0; }
.tab-grid.meta-tab, .tab-grid.removed-tab { grid-template-rows: minmax(0, 1fr); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .7rem; padding: .6rem 1.1rem; }
.pane { overflow: auto; min-height: 0; padding: 0 1.1rem 1.1rem; overscroll-behavior: contain; }
.tab-empty { padding: 2rem 1.1rem; max-width: 40rem; display: grid; gap: .5rem; justify-items: start; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; }
.chip-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .28rem .62rem; font-size: .78rem; font-weight: 550; color: var(--ink-2); cursor: pointer; }
.chip-btn span { font: 500 .7rem var(--mono); color: var(--ink-3); margin-left: .15rem; }
.chip-btn[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip-btn[aria-checked="true"] span { color: inherit; opacity: .75; }
.chip-btn.c-missing span { color: var(--cut); }
.copy-search { width: 13rem; }
.kept-count { font-size: .78rem; color: var(--ink-3); margin-left: auto; }
.seg { display: inline-flex; gap: .2rem; padding: .18rem; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--rule); }
.seg-btn { border: 0; background: transparent; padding: .32rem .65rem; border-radius: 7px; font-size: .78rem; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg-btn[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 0 0 1px var(--rule-2); }
.check { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--ink-2); }
.check input { accent-color: var(--pencil); }

/* proof */
.proof { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  background: linear-gradient(to right, var(--surface-2) 0, var(--surface-2) var(--gut), var(--margin) var(--gut), var(--margin) calc(var(--gut) + 2px), var(--surface) calc(var(--gut) + 2px)); }
.prow { display: grid; grid-template-columns: var(--gut) minmax(0, 1fr) 2.6rem; align-items: start; border-top: 1px solid var(--rule); position: relative; }
.proof > .prow:first-child { border-top: 0; }
.prow:hover { background: color-mix(in srgb, var(--pencil-soft) 35%, transparent); }
.prow.cursor { box-shadow: inset 3px 0 0 var(--pencil); background: color-mix(in srgb, var(--pencil-soft) 50%, transparent); }
.prow.flash { animation: flash 1.5s ease-out; }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--mark) 70%, transparent); } 100% { background: transparent; } }
.gutter { display: flex; flex-direction: column; align-items: flex-end; gap: .28rem; padding: .78rem .65rem .6rem .35rem; background: none; border: 0; cursor: pointer; text-align: right; align-self: stretch; }
.gutter:hover .tag { text-decoration: underline; }
.tag { font: 500 .73rem/1.2 var(--mono); color: var(--pencil); }
.prow.lv1 .tag, .prow.lv2 .tag { font-weight: 600; }
.sub { font: 400 .66rem/1.2 var(--mono); color: var(--ink-3); }
.flag { display: inline-block; font: 500 .66rem/1 var(--mono); color: var(--mark-ink); background: var(--mark); padding: .2rem .34rem; border-radius: 4px; }
.flag.warnflag { background: var(--warn-soft); color: var(--warn); }
.copy { padding: .62rem .9rem .66rem 1.1rem; min-width: 0; }
.keep { display: flex; justify-content: center; padding-top: .85rem; cursor: pointer; }
.keep input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: var(--pencil); cursor: pointer; }
.prow.off .copy { opacity: .3; }
.prow.off .tag { color: var(--cut); text-decoration: line-through; }
.rich { font: 400 1.02rem/1.58 var(--serif); max-width: 74ch; overflow-wrap: anywhere; }
.rich h1, .rich h2, .rich h3, .rich h4, .rich h5, .rich h6 { margin: 0; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.rich h1 { font-size: 1.7rem; } .rich h2 { font-size: 1.38rem; } .rich h3 { font-size: 1.17rem; } .rich h4, .rich h5, .rich h6 { font-size: 1.03rem; }
.rich p, .rich ul, .rich ol, .rich dl, .rich table, .rich blockquote, .rich figure, .rich pre, .rich details, .rich address { margin: 0; }
.rich * + p, .rich * + ul, .rich * + ol, .rich * + table, .rich * + details { margin-top: .45rem; }
.rich ul, .rich ol { padding-left: 1.3rem; } .rich ul { list-style: disc; } .rich ol { list-style: decimal; } .rich ul ul { list-style: circle; }
.rich li + li { margin-top: .12rem; }
.rich table { border-collapse: collapse; font: .84rem/1.45 var(--sans); display: block; overflow-x: auto; max-width: 100%; }
.rich th, .rich td { border: 1px solid var(--rule-2); padding: .32rem .52rem; text-align: left; vertical-align: top; }
.rich th { background: var(--surface-2); }
.rich blockquote { border-left: 3px solid var(--rule-2); padding-left: .9rem; font-style: italic; }
.rich summary { font-weight: 600; }
.rich pre { font: .8rem/1.5 var(--mono); white-space: pre-wrap; }
.rich [data-embed] { font: .84rem/1.5 var(--sans); color: var(--ink-2); }
.rich mark, mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 .05em; }
.chip { font: 500 .68rem/1 var(--mono); background: var(--pencil-soft); color: var(--pencil); padding: .15rem .34rem; border-radius: 4px; font-style: normal; vertical-align: .1em; }
.media-list { display: flex; flex-wrap: wrap; gap: .8rem 1.4rem; }
.imgcard { display: flex; gap: .8rem; align-items: flex-start; margin: 0; min-width: 0; }
.thumb { flex: none; width: 4.2rem; height: 4.2rem; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface-2); }
.thumb.ph { display: grid; place-items: center; font: 500 .68rem var(--mono); color: var(--ink-3); background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--paper) 6px 12px); }
.imgcard figcaption { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.file { font: 500 .74rem/1.35 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.alt { font: italic 400 1rem/1.4 var(--serif); }
.alt.quiet { font: 400 .82rem/1.4 var(--sans); color: var(--ink-2); }
.alt.bad { font: 600 .82rem/1.4 var(--sans); color: var(--cut); }
.alt.warn { font: 600 .78rem/1.4 var(--sans); color: var(--warn); }

/* meta tab */
.two-col { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.5rem 2rem; padding-top: 1rem; align-items: start; }
.col { display: grid; gap: .7rem; min-width: 0; }
.col h3 { font-size: .8rem; font-weight: 700; color: var(--ink-2); letter-spacing: .01em; }
.col h3 + * { margin-top: -.2rem; }
.col-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.serp { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 1rem 1.15rem 1.1rem; font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; max-width: 652px; }
.serp.mobile { max-width: 380px; }
.serp-site { display: flex; gap: .6rem; align-items: center; margin-bottom: .35rem; }
.serp-fav { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--rule); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-2); flex: none; }
.serp-site > span:last-child { display: grid; min-width: 0; }
.serp-name { font-size: 14px; color: var(--serp-meta); line-height: 20px; }
.serp-crumbs { font-size: 12px; color: var(--serp-text); line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.serp-title { font-size: 20px; line-height: 26px; color: var(--serp-title); margin: 0 0 3px; overflow-wrap: anywhere; }
.serp-desc { font-size: 14px; line-height: 22px; color: var(--serp-text); overflow-wrap: anywhere; }
.draft { display: grid; gap: .35rem; padding: .9rem 1rem 1rem; border: 1px dashed var(--rule-2); border-radius: 12px; }
.field-label { font-size: .78rem; font-weight: 650; margin-top: .3rem; }
.edited { font: 500 .66rem var(--mono); color: var(--mark-ink); background: var(--mark); padding: .1rem .3rem; border-radius: 4px; margin-left: .3rem; }
.field { width: 100%; padding: .5rem .6rem; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--surface); font-size: .92rem; resize: vertical; }
.field:focus { outline: none; border-color: var(--pencil); box-shadow: 0 0 0 3px var(--pencil-soft); }
.field.mono { font: .8rem/1.5 var(--mono); }
.meter { display: grid; gap: .22rem; }
.meter .bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.meter .bar span { display: block; height: 100%; background: var(--keep); border-radius: 2px; transition: width .15s; }
.meter.warn .bar span { background: var(--warn); }
.meter p { font-size: .74rem; color: var(--ink-2); } .meter.warn p { color: var(--warn); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .82rem; line-height: 1.45; }
.chk { position: relative; padding-left: .95rem; overflow-wrap: anywhere; }
.chk::before { content: ""; position: absolute; left: 0; top: .45em; width: .45rem; height: .45rem; border-radius: 2px; background: var(--ink-3); }
.chk.error::before { background: var(--cut); } .chk.warn::before { background: #D59A12; } .chk.info::before { background: var(--margin); }
.details { width: 100%; border-collapse: collapse; font-size: .8rem; }
.details th { text-align: left; font-weight: 500; color: var(--ink-3); padding: .3rem .8rem .3rem 0; vertical-align: top; white-space: nowrap; width: 7.5rem; }
.details td { padding: .3rem 0; overflow-wrap: anywhere; border-bottom: 1px solid var(--rule); }

/* outline */
.outline { list-style: none; margin: 0; padding: .2rem 0 0; display: grid; gap: .1rem; }
.oh button { display: flex; align-items: baseline; gap: .6rem; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; cursor: pointer;
  padding: .35rem .6rem .35rem calc(.6rem + (var(--lv) - 1) * 1.35rem); font-family: var(--serif); position: relative; }
.oh button:hover { background: var(--surface); }
.oh button::before { content: ""; position: absolute; left: calc(.15rem + (var(--lv) - 1) * 1.35rem); top: .3rem; bottom: .3rem; width: 2px; background: var(--margin); border-radius: 1px; }
.oh .tag { flex: none; width: 1.6rem; }
.oh-text { font-size: 1rem; }
.oh.lv1 .oh-text { font-size: 1.15rem; font-weight: 600; } .oh.lv2 .oh-text { font-weight: 600; }
.oh.off { opacity: .4; }

/* images */
.img-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .75rem; }
.img-tile button { display: grid; gap: .3rem; width: 100%; height: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 11px; padding: .55rem .55rem .7rem; cursor: pointer; align-content: start; }
